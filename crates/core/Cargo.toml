[package]
name = "traceot-core"
description = "Numerical core of traceot: 1-D optimal transport on quantile grids, local Frechet smoothers and ADOPT transport backfitting."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "traceot_core"

[features]
default = ["parallel"]
# Multi-threading via rayon for the scalable (TRACE) primitives. Disable for WASM.
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1.10", optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false
